name: Build Aseprite Windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master

    - name: Download Skia
      run: |
        curl -L -o skia.zip https://github.com
        7z x skia.zip -oskia

    - name: Build Aseprite
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DLAF_BACKEND=skia -DSKIA_DIR=../skia -DSKIA_LIBRARY_DIR=../skia/out/Release-x64 -G Ninja ..
        ninja aseprite

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows-Free
        path: |
          build/bin/aseprite.exe
          build/bin/data/
